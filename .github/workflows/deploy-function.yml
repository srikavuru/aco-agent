name: Deploy Azure Function

# Function deploys use `func azure functionapp publish` from local.
# The functions-action zip deploy is incompatible with Linux Consumption
# plan's squashfs deployment method. Use the manual deploy command:
#
#   cd aco-agent && func azure functionapp publish aco-agent-func --python
#
# This workflow runs tests on push to validate the backend code.

on:
  push:
    branches: [master]
    paths:
      - 'aco-agent/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r aco-agent/requirements.txt
          pip install pytest

      - name: Run tests
        run: cd aco-agent && python -m pytest tests/ -v
